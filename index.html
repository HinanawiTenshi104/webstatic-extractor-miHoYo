<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="webstatic-proxy" content="/fetch" />
    <title>webstatic-extractor</title>
    <style>
        body {
            display: flex;
            align-content: center;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
            padding-bottom: 100px;
            box-sizing: border-box;
            flex-direction: column;
        }

        html {
            height: 100%;
        }

        #url {
            display: block;
            width: 100%;
            margin: 0 auto;
            outline: 0;
            height: 45px;
            box-sizing: border-box;
            border: 1px solid #ef930b;
            border-radius: 2px;
            text-align: center;
            font-size: 15px;
            font-family: Consolas, monospace;
            padding: 0 10px;
            padding-right: 80px;
        }

        #desc {
            min-height: 80px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: Consolas, monospace;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }

        #btn {
            display: block;
            position: absolute;
            right: 4px;
            top: 4px;
            height: 37px;
            width: auto;
            background: #ef930b;
            border: 0;
            border-radius: 2px;
            color: #fff;
            padding: 0 15px;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        #cc {
            position: relative;
            width: 640px;
            max-width: 90%;
        }

        #tt {
            font-size: 35px;
            font-family: Consolas, monospace;
            color: #ef930b;
            margin-bottom: 20px;
            text-align: center;
        }

        #tt span {
            font-weight: bold;
            color: #d86c32;
        }
        #download-options {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            font: 14px sans-serif;
        }
        #download, #cancel, #concurrency {
            padding: 8px 12px;
        }
    </style>
</head>

<body>
    <div id="tt"><span>W</span>ebstatic <span>E</span>xtractor</div>
    <div id="cc">
        <input type="url" id="url" aria-label="活动页面链接" placeholder="粘贴原神活动页面链接" />
        <button onclick="clk()" id="btn">解析素材</button>
        <div id="desc" role="status" aria-live="polite">输入活动链接，解析后下载图集、骨骼、贴图及其他素材。</div>
        <div id="download-options">
            <label>同时下载
                <select id="concurrency" aria-label="同时下载的文件数">
                    <option value="4">4 个文件</option>
                    <option value="8" selected>8 个文件（推荐）</option>
                    <option value="16">16 个文件</option>
                </select>
            </label>
            <button onclick="downloadZip()" id="download" disabled>下载 ZIP</button>
            <button onclick="cancelDownload()" id="cancel" hidden>取消下载</button>
        </div>
    </div>
    <a href="https://github.com/HinanawiTenshi104/webstatic-extractor" class="github-corner"
        aria-label="View source on GitHub"><svg width="80" height="80" viewBox="0 0 250 250"
            style="fill: #fa932f; color: #fff; position: absolute; top: 0; border: 0; right: 0" aria-hidden="true">

                d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
                fill="currentColor" style="transform-origin: 130px 106px" class="octo-arm"></path>
            <path
                d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
                fill="currentColor" class="octo-body"></path>
        </svg>
    </a>
</body>
<script src="node_modules/acorn/dist/acorn.js"></script>
<script src="extractor.js"></script>
<script src="plan.js"></script>
<script src="vendor.js"></script>
<script src="download.js"></script>
<script src="app.js"></script>

</html>
